<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brightside SQL Sandbox</title>

<style>
:root{--bg:#0f172a;--panel:#1e293b;--line:#334155;--ink:#e2e8f0;--mut:#94a3b8;--acc:#38bdf8;--err:#f87171;--ok:#4ade80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Segoe UI,Arial,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
h1{font-size:19px;margin:0}header span{color:var(--mut);font-size:13px}
main{display:grid;grid-template-columns:250px 1fr;gap:16px;padding:16px 20px}
aside{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;max-height:calc(100vh - 100px);overflow:auto}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:4px 4px 8px}
details{margin-bottom:4px}summary{cursor:pointer;padding:5px 6px;border-radius:6px;font-weight:600;font-family:Consolas,monospace}
summary:hover{background:#0b1220}.col{display:flex;justify-content:space-between;padding:2px 8px 2px 20px;font:13px Consolas,monospace;cursor:pointer;border-radius:4px}
.col:hover{background:#0b1220;color:var(--acc)}.col i{color:var(--mut);font-style:normal;font-size:11px}
textarea{width:100%;min-height:190px;background:#0b1220;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:14px/1.5 Consolas,Menlo,monospace;resize:vertical;tab-size:2}
textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.bar{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap}
button{background:var(--acc);color:#04263a;border:0;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:14px}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
#msg{font-size:13px;color:var(--mut)}#msg.err{color:var(--err)}#msg.ok{color:var(--ok)}
.out{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:55vh}
table{border-collapse:collapse;width:100%;font:13px Consolas,monospace}
th{position:sticky;top:0;background:#0b1220;text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);color:var(--acc)}
td{padding:5px 10px;border-bottom:1px solid #26334a;white-space:nowrap}td.n{text-align:right}td.null{color:var(--mut);font-style:italic}
tr:hover td{background:#16213a}.empty{padding:18px;color:var(--mut)}
@media(max-width:760px){main{grid-template-columns:1fr;padding:12px 16px}aside{max-height:none}}

  m.className="ok";m.textContent=`${x.values.length} row${x.values.length==1?"":"s"} in ${ms} ms`+(r.length>1?" (showing the last result)":"");schema();
 }catch(err){m.className="err";m.textContent="Error: "+err.message;o.innerHTML='<div class="empty">Fix the error and run again.</div>';}}
